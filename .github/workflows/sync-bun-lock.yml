name: Temporary Bun lockfile sync
on:
  push:
    branches:
      - fix/tanstack-start-xss
permissions:
  contents: write
jobs:
  sync-and-validate:
    if: "!contains(github.event.head_commit.message, 'sync Bun lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tanstack-start-xss
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and refresh lockfile
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
          else
            git commit -m "chore: sync Bun lockfile for patched TanStack Start"
            git push origin HEAD:fix/tanstack-start-xss
          fi
      - name: Build
        run: bun run build
