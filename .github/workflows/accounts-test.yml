name: Accounts and company isolation
on:
  pull_request:
    branches: [ceny-versaonova]
  push:
    branches: [ceny-versaonova]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Block high and critical dependency vulnerabilities
        run: bun audit --audit-level=high
  history-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Block historical credential findings pending verified remediation
        run: node scripts/security-scan.mjs --history
  isolated-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Scan current source without revealing secret values
        run: node scripts/security-scan.mjs
      - name: Typecheck and unit authorization tests
        run: |
          bun run typecheck
          bun run lint:release
          bun run test
          bun run test:interface
      - name: Start disposable Supabase and mail catcher
        run: |
          mkdir -p artifacts
          supabase start
          supabase status -o json > artifacts/local-supabase.json
      - name: Database isolation and accounts tests
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/company_isolation.sql > artifacts/company-isolation.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/accounts_permissions.sql > artifacts/accounts-permissions.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/resume_intake.sql > artifacts/resume-intake.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/resume_queue.sql > artifacts/resume-queue.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/resume_analysis.sql > artifacts/resume-analysis.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/candidate_review.sql > artifacts/candidate-review.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/candidate_documents.sql > artifacts/candidate-documents.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/company_search.sql > artifacts/company-search.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/candidate_collaboration.sql > artifacts/candidate-collaboration.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/vacancy_reports.sql > artifacts/vacancy-reports.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/privacy_lifecycle.sql > artifacts/privacy-lifecycle.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/product_quality_metrics.sql > artifacts/product-quality.txt
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/security_catalog.sql > artifacts/security-catalog.txt
      - name: Validate real file intake and Storage
        # All SQL fixtures run in rolled-back transactions.
        run: |
          supabase functions serve > artifacts/edge-test.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:54321/functions/v1/ceny-worker)
            if [ "$code" = "401" ]; then break; fi
            sleep 2
          done
          node tests/isolated-uploads.mjs
      - name: Real signup, confirmation, login, recovery and expired links
        run: node tests/isolated-auth.mjs
      - name: Concurrent human review and AI correction preservation
        run: node tests/isolated-reviews.mjs
      - name: Job governance and approved criteria
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/job_governance.sql > artifacts/job-governance.txt
          node tests/isolated-jobs.mjs
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/ranking_history.sql > artifacts/ranking-history.txt
          node tests/isolated-rankings.mjs
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/apprentice_age.sql > artifacts/apprentice-age.txt
      - name: Privacy Storage erasure and isolated backup recovery
        run: |
          node tests/isolated-privacy.mjs
          node tests/isolated-retention.mjs
      - name: Company operations, quotas, costs and restricted audit
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/company_operations.sql
          node tests/isolated-company-operations.mjs
      - name: Upgrade legacy data and verify relationships on disposable Supabase
        run: |
          supabase db reset --local --no-seed --version 20261107181433
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -v ON_ERROR_STOP=1 -f supabase/tests/platform_before.sql -f "$(echo supabase/migrations/*_platform_integrity.sql)" -f supabase/tests/platform_after.sql
      - name: Restore current schema for browser journeys
        run: supabase db reset --local --no-seed
      - name: Install browser and exercise RH interface
        env:
          CENY_BROWSER_ISOLATED: "true"
        run: |
          bunx playwright install --with-deps chromium
          bun run test:browser
      - name: Build application
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: local-test-placeholder
        run: bun run build
      - name: Inspect browser bundle and prepare release manifest
        run: |
          bun run security:scan
          bun run release:manifest
      - name: Preserve test results without credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accounts-test-results
          path: |
            artifacts/company-isolation.txt
            artifacts/accounts-permissions.txt
            artifacts/auth-results.json
            artifacts/resume-intake.txt
            artifacts/resume-queue.txt
            artifacts/resume-analysis.txt
            artifacts/candidate-review.txt
            artifacts/candidate-documents.txt
            artifacts/company-search.txt
            artifacts/candidate-collaboration.txt
            artifacts/vacancy-reports.txt
            artifacts/privacy-lifecycle.txt
            artifacts/privacy-recovery-results.json
            artifacts/review-results.json
            artifacts/job-governance.txt
            artifacts/job-results.json
            artifacts/ranking-history.txt
            artifacts/ranking-results.json
            artifacts/apprentice-age.txt
            artifacts/upload-results.json
            artifacts/product-quality.txt
            artifacts/security-catalog.txt
            artifacts/release-manifest.json
      - name: Stop disposable test environment
        if: always()
        run: supabase stop --no-backup
